name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Build Windows sandbox host and pipe compatibility module
        run: npm run build:sandbox
      - name: Typecheck
        run: npm run typecheck
      - name: Secret scan
        run: npm run check:secrets
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and contract tests
        run: npm test
      - name: Event replay / fencing / partial / context contract tests
        run: npm run test:replay
      - name: Seeded fault-injection replay suite
        run: npm run test:faults
      - name: Two-connection concurrency conflict suite
        run: npm run test:concurrency
      - name: Production build
        run: npm run build

  release-preflight:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Build Windows sandbox host and pipe compatibility module
        run: npm run build:sandbox
      - name: Release preflight (typecheck, tests, secrets, build, SDK consumer, browser E2E, production smoke)
        run: npm run test:preflight
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            .state/preflight/**
            .state/browser-e2e/**
          if-no-files-found: warn
          retention-days: 14
