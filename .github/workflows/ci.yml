name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Build Windows sandbox host and pipe compatibility module
        run: npm run build:sandbox
      - name: Typecheck
        run: npm run typecheck
      - name: Secret scan
        run: npm run check:secrets
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and contract tests
        run: npm test
      - name: Event replay / fencing / partial / context contract tests
        run: npm run test:replay
      - name: Seeded fault-injection replay suite
        run: npm run test:faults
      - name: Two-connection concurrency conflict suite
        run: npm run test:concurrency
      - name: Connector and plugin copy contract
        run: npm run check:room-plugin && npm run test:mcp-connectors
      - name: Parallel task and image acceptance checks
        run: npm run acceptance:parallel -- --check && npm run acceptance:room-images
      - name: Production build
        run: npm run build


  native-image-pipe:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Host bridge native image smoke (real named pipe, fixed PNG, no model)
        run: npm run test:room-images-native -- --mode host
      - name: Upload native image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-image-evidence
          path: .state/room-images-native/**
          if-no-files-found: warn
          retention-days: 14

  release-preflight:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ROOM_EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Build Windows sandbox host and pipe compatibility module
        run: npm run build:sandbox
      - name: Release preflight (collaboration release, secrets, build, SDK, browser E2E, production smoke, image/connector checks)
        run: npm run test:preflight
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            .state/preflight/**
            .state/collaboration-baseline/**
            .state/browser-e2e/**
            .state/acceptance-room-images/**
            .state/acceptance-parallel/**
          if-no-files-found: warn
          retention-days: 14
